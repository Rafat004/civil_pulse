<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef6c00" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b85450" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff" />

  <!-- Title -->
  <text x="800" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">CivicPulse — System Architecture</text>

  <!-- Browser -->
  <rect x="700" y="80" width="200" height="60" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" />
  <text x="800" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333333">💻 Browser</text>
  <text x="800" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">(Citizen / Admin)</text>

  <!-- Browser -> Frontend Edge -->
  <path d="M 800 140 L 800 180" stroke="#1976d2" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)" />

  <!-- Frontend Container -->
  <rect x="380" y="180" width="840" height="220" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" />
  <text x="400" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">🖥️ Frontend — Next.js 16 App Router (:3000)</text>
  
  <rect x="410" y="230" width="240" height="70" rx="6" ry="6" fill="#f5e6ff" stroke="#9673a6" stroke-width="1.5" />
  <text x="530" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Pages</text>
  <text x="530" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">Dashboard · Map · MyReports · Approvals · Auth</text>

  <rect x="680" y="230" width="260" height="70" rx="6" ry="6" fill="#f5e6ff" stroke="#9673a6" stroke-width="1.5" />
  <text x="810" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Components</text>
  <text x="810" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">AuthProvider · MapComponent · NewReportModal</text>
  <text x="810" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">NavBars · Cards · StatusBadge</text>

  <rect x="970" y="230" width="220" height="70" rx="6" ry="6" fill="#f5e6ff" stroke="#9673a6" stroke-width="1.5" />
  <text x="1080" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">supabaseClient.ts</text>
  <text x="1080" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">(singleton JS client)</text>

  <!-- Internal Frontend Edges -->
  <path d="M 650 265 L 680 265" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 940 265 L 970 265" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />

  <!-- Supabase Container -->
  <rect x="60" y="460" width="620" height="340" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" />
  <text x="80" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">🗄️ Supabase Cloud (Managed BaaS)</text>

  <rect x="90" y="510" width="170" height="60" rx="6" ry="6" fill="#eaf7e8" stroke="#82b366" stroke-width="1.5" />
  <text x="175" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Supabase Auth</text>
  <text x="175" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">email/password · JWT</text>

  <rect x="300" y="510" width="170" height="70" rx="6" ry="6" fill="#eaf7e8" stroke="#82b366" stroke-width="1.5" />
  <text x="385" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">PostgreSQL</text>
  <text x="385" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">profiles · reports · upvotes</text>

  <rect x="490" y="510" width="170" height="60" rx="6" ry="6" fill="#eaf7e8" stroke="#82b366" stroke-width="1.5" />
  <text x="575" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">RLS Policies</text>
  <text x="575" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">public SELECT · auth INSERT</text>
  <text x="575" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">admin-only UPDATE</text>

  <rect x="90" y="600" width="240" height="60" rx="6" ry="6" fill="#eaf7e8" stroke="#82b366" stroke-width="1.5" />
  <text x="210" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Realtime (WebSocket)</text>
  <text x="210" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">publication: supabase_realtime</text>

  <rect x="360" y="600" width="170" height="60" rx="6" ry="6" fill="#eaf7e8" stroke="#82b366" stroke-width="1.5" />
  <text x="445" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Storage Bucket</text>
  <text x="445" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">'reports' images</text>

  <rect x="90" y="700" width="440" height="60" rx="6" ry="6" fill="#eaf7e8" stroke="#82b366" stroke-width="1.5" />
  <text x="310" y="725" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Trigger: handle_new_user</text>
  <text x="310" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">→ auto-create profile</text>

  <!-- Internal Supabase Edges -->
  <path d="M 175 570 L 175 700" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 310 700 L 385 580" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />

  <!-- Backend Container -->
  <rect x="740" y="460" width="640" height="220" rx="8" ry="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" />
  <text x="760" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">⚙️ Backend — Spring Boot 3.2.5 (Java 17) :8082</text>

  <rect x="820" y="510" width="240" height="60" rx="6" ry="6" fill="#fff2e6" stroke="#d79b00" stroke-width="1.5" />
  <text x="940" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">IntelligenceController</text>
  <text x="940" y="555" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">/api/v1/intelligence/*</text>

  <rect x="820" y="600" width="240" height="60" rx="6" ry="6" fill="#fff2e6" stroke="#d79b00" stroke-width="1.5" />
  <text x="940" y="625" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">SupabaseClientService</text>
  <text x="940" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">RestTemplate → PostgREST</text>

  <!-- Internal Backend Edge -->
  <path d="M 940 570 L 940 600" stroke="#d79b00" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />

  <!-- External Tiles -->
  <rect x="1390" y="230" width="190" height="60" rx="6" ry="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" />
  <text x="1485" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">🗺️ CartoDB/OSM Tiles</text>
  <text x="1485" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666666">+ Nominatim Geocoder</text>

  <!-- Cross Edges -->
  <!-- Frontend to Supabase -->
  <path d="M 1080 300 L 1080 420 L 300 420 L 300 510" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)" />
  <text x="690" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">SQL · Auth · Storage</text>

  <!-- Frontend to Backend -->
  <path d="M 1080 300 L 1080 420 L 940 420 L 940 460" stroke="#ef6c00" stroke-width="2" fill="none" marker-end="url(#arrowhead-orange)" />
  <text x="1010" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ef6c00" text-anchor="middle">REST: dup-check, audit</text>

  <!-- Frontend to External Tiles -->
  <path d="M 1190 265 L 1390 265" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)" />

  <!-- Backend to DB -->
  <path d="M 820 630 L 700 630 L 700 545 L 470 545" stroke="#ef6c00" stroke-width="2" fill="none" marker-end="url(#arrowhead-orange)" />
  <text x="585" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ef6c00" text-anchor="middle">GET /rest/v1/reports</text>

  <!-- Realtime to Frontend -->
  <path d="M 210 600 L 210 400 L 1080 400 L 1080 300" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowhead-green)" />
  <text x="645" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">broadcasts INSERT/UPDATE</text>

</svg>